[build-system]
requires = ["setuptools>=68.0", "wheel>=0.41"]
build-backend = "setuptools.build_meta"

[project]
name = "jira-repo-automation"
version = "0.1.0"
description = "Automates Jira-driven code changes via Kiro spec generation"
requires-python = ">=3.11"
dependencies = [
    "jira==3.8.0",
    "GitPython==3.1.43",
    "python-dotenv==1.0.1",
]

[project.optional-dependencies]
dev = [
    "hypothesis==6.131.15",
    "pytest==8.3.5",
    "pytest-cov==5.0.0",
]

[project.scripts]
jira-repo-automation = "jira_repo_automation.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["jira_repo_automation*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v"

[tool.coverage.run]
source = ["jira_repo_automation"]
omit = ["tests/*"]
